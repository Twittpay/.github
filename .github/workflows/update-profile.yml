name: Update organization profile

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "profile/README.template.md"
      - "scripts/build_profile.py"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build profile README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG: ${{ github.repository_owner }}
        run: python3 scripts/build_profile.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain profile/README.md)" ]; then
            git config user.name "TwittPay Bot"
            git config user.email "bot@users.noreply.github.com"
            git add profile/README.md
            git commit -m "Update addon list"
            git push
          else
            echo "No change"
          fi
